[project]
name = "agentcontrol"
version = "0.1.0.dev0"
description = "Runtime governance for AI agents: deterministic tool-call authorization, exported as OpenTelemetry."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "AgentControl contributors" }]
keywords = ["agents", "governance", "authorization", "opa", "opentelemetry", "langgraph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

# Pins verified against the vendored clones in refs/; see
# specs/001-agentcontrol-runtime-governance/research.md#pinned-sources.
dependencies = [
    "langchain>=1.3.14,<2",
    "langgraph>=1.2.10,<2",
    "httpx>=0.27,<1",
    "opentelemetry-api>=1.37,<2",
    "opentelemetry-sdk>=1.37,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.37,<2",
    # Stable attributes only. The gen_ai.* surface of this package is deprecated
    # and moved upstream, so those constants are vendored in core/semconv.py.
    "opentelemetry-semantic-conventions>=0.58b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "langgraph-checkpoint-sqlite>=2",
    "ruff>=0.6",
    "mypy>=1.11",
    "pyyaml>=6",
    "jsonschema>=4",
    "langchain-mcp-adapters>=0.3",
    "mcp>=1.0,<2.0",
]

[project.urls]
Homepage = "https://github.com/kowshikdev/LangRun"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentcontrol"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "langgraph-checkpoint-sqlite>=2",
    "ruff>=0.6",
    "mypy>=1.11",
    "pyyaml>=6",
    "jsonschema>=4",
    "langchain-mcp-adapters>=0.3",
    "mcp>=1.0,<2.0",
]

# ---------------------------------------------------------------- pytest (T004)

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
markers = [
    "integration: requires a reachable OPA and/or OTLP sink",
    "conformance: exercises a real LangGraph agent to prove a capability-manifest field",
    "live_opa: requires a live `opa run --server` rather than a mocked transport",
]

# ------------------------------------------------------------------ ruff (T003)

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ANN", "D"]
ignore = [
    "D203",   # conflicts with D211
    "D213",   # conflicts with D212
    "ANN401", # Any is load-bearing in Evidence.value and ActionIntent.arguments
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ------------------------------------------------------------------ mypy (T003)

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
files = ["agentcontrol"]

[[tool.mypy.overrides]]
module = ["langgraph.*", "langchain.*", "respx.*"]
ignore_missing_imports = true
